name: Housing source access check
on:
  workflow_dispatch:
  push:
    branches: [feature/school-housing-tracker]
    paths: [.github/workflows/housing-access-check.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public source from GitHub runner
        shell: python
        run: |
          import json, re, urllib.request
          url = "https://www.zillow.com/schools/102507/north-gwinnett-high-school/"
          req = urllib.request.Request(url, headers={"User-Agent": "Schoolside/0.2"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8")
              print("HTTP", response.status)
          if re.search(r"px-captcha|verify you are human|Access to this page has been denied", html, re.I):
              raise RuntimeError("Source challenge: stopped without bypass")
          match = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          state = json.loads(match.group(1))["props"]["pageProps"]["searchPageState"]
          assert state["queryState"]["schoolId"] == 102507
          print("Search schema available; cloud access probe passed")
