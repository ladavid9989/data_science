name: Hourly school housing batches
on:
  workflow_dispatch:
    inputs:
      detail_limit:
        description: Maximum detail requests in this batch
        default: '2'
        required: false
  schedule:
    # Best-effort wakeups; the persisted collector gate enforces >= 1h between batches.
    - cron: '17,47 * * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: school-housing-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/school-housing-tracker
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data/school-housing-tracker
          path: archive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r code/housing-tracker/requirements-collector.txt
      - name: Restore prior observations
        working-directory: code/housing-tracker
        run: python -m tracker.cli --db "$RUNNER_TEMP/housing.sqlite3" rebuild "$GITHUB_WORKSPACE/archive"
      - name: Resume bounded collection batch
        id: collect
        continue-on-error: true
        working-directory: code/housing-tracker
        env:
          DETAIL_LIMIT: ${{ inputs.detail_limit || '2' }}
        run: python -m tracker.cli --db "$RUNNER_TEMP/housing.sqlite3" collect --archive "$GITHUB_WORKSPACE/archive" --request-limit 3 --detail-limit "$DETAIL_LIMIT"
      - name: Persist observations and failure records
        if: always() && steps.collect.outcome != 'skipped'
        working-directory: archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p snapshots state raw
          git add snapshots state raw index.json
          if ! git diff --cached --quiet; then
            git commit -m "Record housing observations $(date -u +%F)"
            git push origin HEAD:data/school-housing-tracker
          fi
      - name: Report incomplete collection
        if: steps.collect.outcome != 'success'
        run: |
          echo 'Collection incomplete. Saved observations/failure records remain available; no missing day is filled with zero inventory.'
          exit 1
